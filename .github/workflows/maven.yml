name: Java CI/CD Automation with Selenium

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # تشغيل التستات مع طباعة كاملة للمخرجات والاستثناءات في الـ Terminal
      - name: Run Maven Tests
        run: |
          mvn clean test -Dtest=* -DfailIfNoTests=false
        continue-on-error: true

      # طباعة تقارير Surefire المباشرة لرؤية الأسعار والمخرجات
      - name: Print Test Logs
        run: |
          echo "=== Surefire Reports Output ==="
          cat target/surefire-reports/*.txt || echo "No surefire text reports found"